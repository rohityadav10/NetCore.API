# PROD "additional automated checks" (exercise section 3.8). This job is in the PROD stage,
# so it runs AFTER the approvals, immediately before the deployment jobs, which depend on it:
#   1. All previous stages succeeded: the stage's dependsOn/condition guarantee it.
#   2. The Build stage's recorded evidence: 100% test pass rate, coverage >= the threshold in
#      force now, and no blocking SAST / dependency / image findings (assert-release-ready.ps1).
#   3. No ACTIVE High/Critical findings: re-scan the exact image digest, and the
#      dependencies, with today's vulnerability data. A CVE published between the build and
#      the approval blocks the release.
parameters:
  - name: requiredChecks           # evidence files the Build stage must have produced
    type: string
  - name: dependencyRescanSteps    # app-specific fresh dependency check
    type: stepList
    default: []

jobs:
  - job: Preflight
    displayName: PROD preflight (evidence + fresh re-scan)
    pool:
      vmImage: ubuntu-24.04
    variables:
      rescanDir: $(Agent.TempDirectory)/rescan
    steps:
      - checkout: self
        fetchDepth: 1
      - download: current
        patterns: 'quality-*/**'
      - download: current
        artifact: image-info

      - task: PowerShell@2
        displayName: Verify build evidence (tests, coverage, scans)
        inputs:
          targetType: filePath
          filePath: .azure/scripts/assert-release-ready.ps1
          arguments: -EvidenceDir '$(Pipeline.Workspace)' -CoverageThreshold $(coverageThreshold) -RequiredChecks '${{ parameters.requiredChecks }}'
          pwsh: true

      - task: AzureCLI@2
        displayName: Pull the exact image being released
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            ref="$(jq -r .digestRef "$(Pipeline.Workspace)/image-info/image.json")"
            az acr login --name "$(acrName)"
            docker pull "$ref"
            echo "##vso[task.setvariable variable=releaseImage]$ref"

      - task: PowerShell@2
        displayName: Re-scan the image with current vulnerability data
        inputs:
          targetType: filePath
          filePath: .azure/scripts/trivy-scan.ps1
          arguments: -ScanType image -Target '$(releaseImage)' -Name image-rescan -ReportDir '$(rescanDir)' -TrivyImage '$(trivyImage)'
          pwsh: true

      - ${{ parameters.dependencyRescanSteps }}

      - publish: $(rescanDir)
        artifact: prod-rescan
        condition: succeededOrFailed()
        displayName: Publish re-scan reports
