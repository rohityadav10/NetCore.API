# Canary deployment of the build's image (by digest) to an Azure Container App, with
# automatic rollback. Auth: the ARM service connection uses workload identity federation
# (OIDC), so no client secret exists anywhere. See .azure/scripts/deploy-containerapps.sh.
parameters:
  - name: environment
    type: string
    default: prod
  - name: dependsOn
    type: object
    default: []
  - name: containerApp
    type: string
  - name: healthPath
    type: string
  - name: versionPath
    type: string
  - name: environmentVariables   # values may use {{fqdn:<other-app>}}
    type: object
    default: {}
  - name: secretVariables        # names of variable-group secrets -> Container App secrets
    type: object
    default: []
  - name: canaryPercent
    type: string
    default: '10'
  - name: canarySeconds
    type: string
    default: '120'

jobs:
  - deployment: DeployContainerApps
    displayName: Container Apps canary deploy (${{ parameters.environment }})
    dependsOn: ${{ parameters.dependsOn }}
    environment: ${{ parameters.environment }}
    pool:
      vmImage: ubuntu-24.04
    strategy:
      runOnce:
        deploy:
          steps:
            - download: current
              artifact: image-info
            - download: current
              artifact: deploy-scripts

            - task: AzureCLI@2
              name: aca
              displayName: Canary deploy, smoke test, promote (auto-rollback on failure)
              inputs:
                azureSubscription: $(azureServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  # Deploy the exact image the Build stage scanned: the digest, not a mutable tag.
                  export IMAGE="$(jq -r .digestRef "$(Pipeline.Workspace)/image-info/image.json")"
                  bash "$(Pipeline.Workspace)/deploy-scripts/deploy-containerapps.sh"
              env:
                APP_NAME: ${{ parameters.containerApp }}
                RESOURCE_GROUP: $(resourceGroup)
                BUILD_NUMBER: $(Build.BuildNumber)
                HEALTH_PATH: ${{ parameters.healthPath }}
                VERSION_PATH: ${{ parameters.versionPath }}
                ENV_VARS_JSON: ${{ convertToJson(parameters.environmentVariables) }}
                SECRET_NAMES: ${{ join(',', parameters.secretVariables) }}
                CANARY_PERCENT: ${{ parameters.canaryPercent }}
                CANARY_SECONDS: ${{ parameters.canarySeconds }}
                ATTEMPT: $(System.JobAttempt)
                ${{ each name in parameters.secretVariables }}:
                  ${{ name }}: $(${{ name }})

        on:
          success:
            steps:
              - download: current
                artifact: deploy-scripts
              - template: ../steps/notify.yml
                parameters:
                  stage: Deploy ${{ parameters.environment }} (Container App ${{ parameters.containerApp }})
                  status: Succeeded
                  detail: Canary passed; the new revision has 100% of traffic.
                  scriptsPath: $(Pipeline.Workspace)/deploy-scripts
          failure:
            steps:
              - download: current
                artifact: deploy-scripts
              - template: ../steps/notify.yml
                parameters:
                  stage: Deploy ${{ parameters.environment }} (Container App ${{ parameters.containerApp }})
                  status: Failed
                  detail: Traffic was returned to the previous revision.
                  scriptsPath: $(Pipeline.Workspace)/deploy-scripts
