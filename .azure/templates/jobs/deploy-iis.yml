# Deploys a build artifact to an IIS site on the on-premises server, via the self-hosted
# agent pool installed there. Used for SIT, UAT and (optionally) PROD, for both apps.
# Approvals/checks come from the Azure DevOps environment, not from this YAML.
parameters:
  - name: environment        # Azure DevOps environment: sit | uat | prod
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: agentPool
    type: string
    default: OnPrem-IIS
  - name: artifactName       # api-drop | web-drop
    type: string
  - name: appType            # AspNetCore | Spa
    type: string
    values: [AspNetCore, Spa]
  - name: siteName
    type: string
  - name: port
    type: string
  - name: healthPath         # liveness, e.g. /health or /
    type: string
  - name: versionPath        # JSON with "version" == build number, e.g. /api/AppStatus or /config.json
    type: string
  - name: environmentVariables   # AspNetCore: written into web.config
    type: object
    default: {}
  - name: secretVariables    # names of variable-group secrets added to web.config the same way
    type: object
    default: []
  - name: spaConfig          # Spa: written as config.json
    type: object
    default: {}
  - name: targetServer       # empty = the agent IS the IIS server; else deploy there over WinRM
    type: string
    default: ''

jobs:
  - deployment: DeployIIS
    displayName: IIS deploy (${{ parameters.environment }}, ${{ parameters.artifactName }})
    dependsOn: ${{ parameters.dependsOn }}
    environment: ${{ parameters.environment }}
    pool:
      name: ${{ parameters.agentPool }}
    workspace:
      clean: all
    strategy:
      runOnce:
        deploy:
          steps:
            - download: current
              artifact: ${{ parameters.artifactName }}
            - download: current
              artifact: deploy-scripts

            - task: PowerShell@2
              displayName: Deploy, smoke test, auto-rollback
              inputs:
                targetType: inline
                pwsh: false   # Windows PowerShell 5.1: present on every IIS server, ships WebAdministration
                script: |
                  & "$(Pipeline.Workspace)\deploy-scripts\deploy-iis.ps1" `
                    -ArtifactPath "$(Pipeline.Workspace)\${{ parameters.artifactName }}" `
                    -SiteName '${{ parameters.siteName }}' `
                    -AppPoolName '${{ parameters.siteName }}' `
                    -Port ${{ parameters.port }} `
                    -BuildNumber '$(Build.BuildNumber)' `
                    -HealthCheckUrl 'http://${{ coalesce(parameters.targetServer, 'localhost') }}:${{ parameters.port }}${{ parameters.healthPath }}' `
                    -VersionUrl 'http://${{ coalesce(parameters.targetServer, 'localhost') }}:${{ parameters.port }}${{ parameters.versionPath }}' `
                    -AppType '${{ parameters.appType }}' `
                    -EnvironmentVariablesJson $env:DEPLOY_ENVIRONMENT_VARIABLES `
                    -SecretVariableNames '${{ join(',', parameters.secretVariables) }}' `
                    -SpaConfigJson $env:DEPLOY_SPA_CONFIG `
                    -ComputerName '${{ parameters.targetServer }}'
                  exit $LASTEXITCODE
              env:
                # Objects become JSON at compile time; $(macros) inside them expand at run time.
                DEPLOY_ENVIRONMENT_VARIABLES: ${{ convertToJson(parameters.environmentVariables) }}
                DEPLOY_SPA_CONFIG: ${{ convertToJson(parameters.spaConfig) }}
                # Only used with targetServer (remote mode); unset means the agent's own identity.
                IIS_DEPLOY_USERNAME: $(IIS_DEPLOY_USERNAME)
                IIS_DEPLOY_PASSWORD: $(IIS_DEPLOY_PASSWORD)
                # Secrets are never auto-exposed to scripts; map each one explicitly.
                ${{ each name in parameters.secretVariables }}:
                  ${{ name }}: $(${{ name }})

        on:
          # Lifecycle hooks run as separate jobs, so each downloads the scripts it needs.
          success:
            steps:
              - download: current
                artifact: deploy-scripts
              - template: ../steps/notify.yml
                parameters:
                  stage: Deploy ${{ parameters.environment }} (IIS ${{ parameters.siteName }})
                  status: Succeeded
                  detail: http://${{ coalesce(parameters.targetServer, 'localhost') }}:${{ parameters.port }}
                  windowsPowerShell: true
                  scriptsPath: $(Pipeline.Workspace)\deploy-scripts
          failure:
            steps:
              - download: current
                artifact: deploy-scripts
              - template: ../steps/notify.yml
                parameters:
                  stage: Deploy ${{ parameters.environment }} (IIS ${{ parameters.siteName }})
                  status: Failed
                  detail: The previous release was restored automatically if one existed. See deployments.log on the server.
                  windowsPowerShell: true
                  scriptsPath: $(Pipeline.Workspace)\deploy-scripts
