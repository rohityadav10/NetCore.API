# Build stage for NetCore.API. Runs for every trigger: feature/* pushes, PRs, and merges.
# Every gate here fails the stage; nothing downstream (image push, SIT...) runs past a failure.
#
#   BuildTest ──┐
#               ├──> Container (docker build -> Trivy image gate -> push, merges only)
#   Security  ──┘
#
# Gates, in pipeline order:
#   BuildTest  unit tests (any failure), line coverage (< coverageThreshold)
#   Security   SAST: Semgrep (ERROR/HIGH/CRITICAL); dependencies: NuGet advisories (High/Critical)
#   Container  image: Trivy (fixable HIGH/CRITICAL in OS packages or runtime libraries)
# Each gate writes a summary-*.json into a quality-* artifact: the evidence PROD re-checks.
parameters:
  - name: enableSonarCloud
    type: boolean
    default: false

stages:
  - stage: Build
    displayName: Build, test & scan
    jobs:
      # ── Restore, build, test, coverage, publish IIS drop ──────────────────────
      - job: BuildTest
        displayName: Build & test (.NET)
        pool:
          vmImage: ubuntu-24.04
        variables:
          NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
          testResultsDir: $(Agent.TempDirectory)/TestResults
          reportDir: $(Build.ArtifactStagingDirectory)/quality
        steps:
          - checkout: self
            fetchDepth: 0   # full history: SonarCloud blame / new-code detection

          - task: UseDotNet@2
            displayName: Use .NET SDK $(dotnetSdkVersion)
            inputs:
              packageType: sdk
              version: $(dotnetSdkVersion)

          - task: Cache@2
            displayName: Cache NuGet packages
            inputs:
              key: 'nuget | "$(Agent.OS)" | **/*.csproj'
              restoreKeys: |
                nuget | "$(Agent.OS)"
              path: $(NUGET_PACKAGES)

          - ${{ if parameters.enableSonarCloud }}:
            - task: SonarCloudPrepare@3
              displayName: SonarCloud - prepare
              inputs:
                SonarCloud: $(sonarCloudServiceConnection)
                organization: $(sonarCloudOrganization)
                scannerMode: dotnet
                projectKey: $(sonarCloudProjectKey)
                extraProperties: |
                  sonar.cs.vstest.reportsPaths=$(testResultsDir)/*.trx
                  sonar.cs.opencover.reportsPaths=$(testResultsDir)/*/coverage.opencover.xml
                  sonar.qualitygate.wait=true

          - script: dotnet restore NetCore.API.sln
            displayName: Restore (NuGet)

          - script: dotnet build NetCore.API.sln --configuration Release --no-restore -p:InformationalVersion=$(Build.BuildNumber)
            displayName: Build (Release, stamped $(Build.BuildNumber))

          - script: >
              dotnet test NetCore.API.sln --configuration Release --no-build
              --logger "trx;LogFileName=test-results.trx"
              --collect "XPlat Code Coverage"
              --results-directory $(testResultsDir)
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover
            displayName: Unit tests (xUnit) + coverage (Coverlet)

          - task: PublishTestResults@2
            displayName: Publish test results (TRX)
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '*.trx'
              searchFolder: $(testResultsDir)
              testRunTitle: NetCore.API unit tests
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish coverage (Cobertura, HTML report tab)
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(testResultsDir)/*/coverage.cobertura.xml

          - task: PowerShell@2
            name: gate
            displayName: 'Gate: 100% tests pass, coverage >= $(coverageThreshold)%'
            condition: succeededOrFailed()
            inputs:
              targetType: inline
              # Inline call, not 'arguments': the org's shell-argument validation rejects characters
              # such as '@' in the pinned image digests (https://aka.ms/ado/75787).
              script: |
                & ".azure/scripts/quality-gate.ps1" -TestResults '$(testResultsDir)/*.trx' -Coverage '$(testResultsDir)/*/coverage.cobertura.xml' -Threshold $(coverageThreshold) -ReportDir '$(reportDir)'
                exit $LASTEXITCODE
              pwsh: true

          - ${{ if parameters.enableSonarCloud }}:
            - task: SonarCloudAnalyze@3
              displayName: SonarCloud - analyze (fails on quality gate)
            - task: SonarCloudPublish@3
              displayName: SonarCloud - publish
              inputs:
                pollingTimeoutSec: '300'

          - script: dotnet publish NetCore.API.csproj --configuration Release --no-build --output $(Build.ArtifactStagingDirectory)/api-drop
            displayName: Publish IIS drop

          - publish: $(Build.ArtifactStagingDirectory)/api-drop
            artifact: api-drop
            displayName: 'Artifact: api-drop (IIS)'

          - publish: .azure/scripts
            artifact: deploy-scripts
            displayName: 'Artifact: deploy-scripts'

          - publish: $(reportDir)
            artifact: quality-tests
            displayName: 'Evidence: quality-tests'
            condition: succeededOrFailed()

      # ── SAST and dependency scanning (parallel with BuildTest) ─────────────────
      - job: Security
        displayName: SAST & dependency scan
        pool:
          vmImage: ubuntu-24.04
        variables:
          NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
          reportDir: $(Build.ArtifactStagingDirectory)/quality
          sarifDir: $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs
        steps:
          - checkout: self
            fetchDepth: 1

          - task: PowerShell@2
            displayName: 'Gate: SAST (Semgrep)'
            inputs:
              targetType: inline
              # Inline call, not 'arguments': the org's shell-argument validation rejects characters
              # such as '@' in the pinned image digests (https://aka.ms/ado/75787).
              script: |
                & ".azure/scripts/semgrep-scan.ps1" -Configs 'p/csharp,p/secrets,p/owasp-top-ten,p/dockerfile' -Exclude 'tests' -ReportDir '$(reportDir)' -SemgrepImage '$(semgrepImage)'
                exit $LASTEXITCODE
              pwsh: true

          - task: UseDotNet@2
            displayName: Use .NET SDK $(dotnetSdkVersion)
            condition: succeededOrFailed()
            inputs:
              packageType: sdk
              version: $(dotnetSdkVersion)

          - task: Cache@2
            displayName: Cache NuGet packages
            condition: succeededOrFailed()
            inputs:
              key: 'nuget | "$(Agent.OS)" | **/*.csproj'
              restoreKeys: |
                nuget | "$(Agent.OS)"
              path: $(NUGET_PACKAGES)

          - script: dotnet restore NetCore.API.sln
            displayName: Restore (for the dependency graph)
            condition: succeededOrFailed()

          - task: PowerShell@2
            displayName: 'Gate: vulnerable NuGet packages (High/Critical)'
            condition: succeededOrFailed()
            inputs:
              targetType: inline
              # Inline call, not 'arguments': the org's shell-argument validation rejects characters
              # such as '@' in the pinned image digests (https://aka.ms/ado/75787).
              script: |
                & ".azure/scripts/dotnet-vulnerable-packages.ps1" -Solution NetCore.API.sln -ReportDir '$(reportDir)'
                exit $LASTEXITCODE
              pwsh: true

          # "CodeAnalysisLogs" is the artifact name the SARIF SAST Scans Tab extension renders.
          - pwsh: |
              New-Item -ItemType Directory -Path '$(sarifDir)' -Force | Out-Null
              Copy-Item '$(reportDir)/*.sarif' '$(sarifDir)' -ErrorAction SilentlyContinue
            displayName: Collect SARIF
            condition: succeededOrFailed()
          - publish: $(sarifDir)
            artifact: CodeAnalysisLogs
            displayName: 'Artifact: CodeAnalysisLogs (SARIF)'
            condition: succeededOrFailed()
          - publish: $(reportDir)
            artifact: quality-security
            displayName: 'Evidence: quality-security'
            condition: succeededOrFailed()

      # ── Container image: build, scan, push (push only for deployable builds) ────
      - job: Container
        displayName: Docker image, scan & push
        dependsOn: [BuildTest, Security]
        pool:
          vmImage: ubuntu-24.04
        variables:
          imageRef: $(acrLoginServer)/netcore-api:$(Build.BuildNumber)
          reportDir: $(Build.ArtifactStagingDirectory)/quality
        steps:
          - checkout: self
            fetchDepth: 1

          - script: >
              docker build
              --file .azure/docker/Dockerfile.api
              --build-arg APP_VERSION=$(Build.BuildNumber)
              --label org.opencontainers.image.revision=$(Build.SourceVersion)
              --label org.opencontainers.image.source=$(Build.Repository.Uri)
              --tag $(imageRef)
              --provenance=false
              .
            displayName: docker build (multi-stage, chiseled runtime)
            env:
              DOCKER_BUILDKIT: 1

          - task: PowerShell@2
            displayName: 'Gate: image vulnerabilities (Trivy) + SBOM'
            inputs:
              targetType: inline
              # Inline call, not 'arguments': the org's shell-argument validation rejects characters
              # such as '@' in the pinned image digests (https://aka.ms/ado/75787).
              script: |
                & ".azure/scripts/trivy-scan.ps1" -ScanType image -Target '$(imageRef)' -Name image -ReportDir '$(reportDir)' -TrivyImage '$(trivyImage)' -Sbom
                exit $LASTEXITCODE
              pwsh: true

          - task: AzureCLI@2
            displayName: Push to ACR (build once, promote everywhere)
            condition: and(succeeded(), eq(variables.isDeployable, 'true'))
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "$(acrName)"
                docker push "$(imageRef)"
                digest_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$(imageRef)")"
                mkdir -p "$(Build.ArtifactStagingDirectory)/image-info"
                jq -n --arg tag "$(imageRef)" --arg digest "$digest_ref" \
                      --arg build "$(Build.BuildNumber)" --arg commit "$(Build.SourceVersion)" \
                      '{tagRef: $tag, digestRef: $digest, build: $build, commit: $commit}' \
                  > "$(Build.ArtifactStagingDirectory)/image-info/image.json"
                cat "$(Build.ArtifactStagingDirectory)/image-info/image.json"

          # Keep the newest 10 images plus anything a live Container App revision runs.
          # A failed clean-up is logged, never a failed build.
          - task: AzureCLI@2
            displayName: ACR retention (keep 10 + in-use)
            condition: and(succeeded(), eq(variables.isDeployable, 'true'))
            continueOnError: true
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: bash .azure/scripts/acr-retention.sh
            env:
              ACR_NAME: $(acrName)
              REPOSITORY: netcore-api
              RESOURCE_GROUP: $(resourceGroup)
              KEEP: '10'

          - publish: $(Build.ArtifactStagingDirectory)/image-info
            artifact: image-info
            displayName: 'Artifact: image-info (tag + digest)'
            condition: and(succeeded(), eq(variables.isDeployable, 'true'))
          - publish: $(reportDir)
            artifact: quality-image
            displayName: 'Evidence: quality-image (+ SBOM)'
            condition: succeededOrFailed()

      # ── Notification ──────────────────────────────────────────────────────────
      - job: Notify
        displayName: Notify
        dependsOn: [BuildTest, Security, Container]
        condition: always()
        pool:
          vmImage: ubuntu-24.04
        variables:
          buildTestResult: $[ dependencies.BuildTest.result ]
          securityResult: $[ dependencies.Security.result ]
          containerResult: $[ dependencies.Container.result ]
          overall: $[ iif(and(eq(dependencies.BuildTest.result, 'Succeeded'), eq(dependencies.Security.result, 'Succeeded'), eq(dependencies.Container.result, 'Succeeded')), 'Succeeded', 'Failed') ]
        steps:
          - checkout: self
            fetchDepth: 1
          - template: ../steps/notify.yml
            parameters:
              stage: Build
              status: $(overall)
              detail: 'Build/test: $(buildTestResult). Security: $(securityResult). Image: $(containerResult).'
