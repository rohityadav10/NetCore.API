# PROD: Azure Container Apps (primary). The 'prod' environment carries the approval,
# second sign-off and business-hours checks. The IIS values apply only when the pipeline
# is queued with prodTarget = iis or both.
variables:
  environmentLabel: PROD
  aspnetcoreEnvironment: Production
  apiContainerApp: netcore-api
  webContainerApp: angular-web
  canaryPercent: 10
  canarySeconds: 120
  apiIisSite: ado-netcore-api-prod
  apiIisPort: 8381
  webIisSite: ado-angular-web-prod
  webIisPort: 8380
