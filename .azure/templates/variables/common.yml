# Values shared by every stage of both pipelines. NetCore.API and Angular.web keep identical
# copies, because each app needs the other's URL (SPA -> API calls, API CORS origin).
# Nothing secret belongs here: secrets live in the variable groups listed in .azure/SETUP.md.
variables:
  # ── Azure (must match the service connection and .azure/infra/main.bicep) ──────────
  azureServiceConnection: sc-devops-exercise-azure   # ARM, workload identity federation (OIDC)
  resourceGroup: rg-devops-exercise
  acrName: acrrohitdevops01                          # globally unique; created by .azure/infra/main.bicep
  acrLoginServer: $(acrName).azurecr.io

  # ── Tool images, pinned by version AND digest: a moved tag can't change what runs ──
  trivyImage: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  semgrepImage: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b

  # ── Quality gate (see README-PIPELINE.md, "Security & quality gates") ────────────
  coverageThreshold: 70

  # ── On-premises IIS ──────────────────────────────────────────────────────────────
  # How BROWSERS reach the IIS server: builds the SPA's API URL and the API's CORS origin.
  # http://localhost works when you browse on the server itself; set the server's DNS name otherwise.
  iisPublicHost: http://localhost
