# SIT: System Integration Testing. On-premises IIS; deployed automatically on merge.
# Site names/ports are prefixed "ado-" so they never collide with the sites the GitHub
# Actions workflows deploy on the same server (NetCoreAPI:8080, Default Web Site:80).
variables:
  environmentLabel: SIT
  aspnetcoreEnvironment: SIT
  apiIisSite: ado-netcore-api-sit
  apiIisPort: 8181
  webIisSite: ado-angular-web-sit
  webIisPort: 8180
