# Posts a stage result to Teams (TEAMS_WEBHOOK_URL in the devops-exercise-shared group).
# Never fails the pipeline: no webhook configured means the step just logs.
parameters:
  - name: stage
    type: string
  - name: status
    type: string
  - name: detail
    type: string
    default: ''
  # true on the on-prem IIS agent (Windows PowerShell 5.1), false on hosted Linux (pwsh 7)
  - name: windowsPowerShell
    type: boolean
    default: false
  - name: scriptsPath
    type: string
    default: $(Build.SourcesDirectory)/.azure/scripts

steps:
  - task: PowerShell@2
    displayName: Notify (${{ parameters.stage }})
    condition: always()
    continueOnError: true
    inputs:
      targetType: filePath
      filePath: ${{ parameters.scriptsPath }}/notify.ps1
      arguments: -Stage '${{ parameters.stage }}' -Status '${{ parameters.status }}' -Detail '${{ parameters.detail }}'
      pwsh: ${{ not(parameters.windowsPowerShell) }}
    env:
      TEAMS_WEBHOOK_URL: $(TEAMS_WEBHOOK_URL)
