# NetCore.API: manual rollback, queued on demand ("Run pipeline" in Azure DevOps).
#
# Automatic rollback already happens inside every deployment that fails its smoke test
# (deploy-iis.ps1 / deploy-containerapps.sh). This pipeline covers the other case: a release
# that passed its checks but turns out to be bad later. It uses the same environments, so the
# same approvals apply (e.g. rolling back PROD needs PROD approval).
#   IIS:            point the site back at an earlier release folder (rollback-iis.ps1)
#   Container Apps: move 100% of traffic back to an earlier revision (reactivating it if needed)

trigger: none
pr: none

parameters:
  - name: target
    displayName: What to roll back
    type: string
    values: [sit, uat, prod-iis, prod-containerapps]
  - name: toBuild
    displayName: Build number to return to ('previous' = the release before the live one)
    type: string
    default: previous

variables:
  - template: templates/variables/common.yml
  - group: devops-exercise-shared
  - ${{ if eq(parameters.target, 'sit') }}:
    - template: templates/variables/sit.yml
  - ${{ if eq(parameters.target, 'uat') }}:
    - template: templates/variables/uat.yml
  - ${{ if startsWith(parameters.target, 'prod') }}:
    - template: templates/variables/prod.yml

stages:
  - stage: Rollback
    displayName: Roll back ${{ parameters.target }} to ${{ parameters.toBuild }}
    jobs:
      - ${{ if ne(parameters.target, 'prod-containerapps') }}:
        - deployment: RollbackIIS
          displayName: IIS site (NetCore.API)
          environment: ${{ replace(parameters.target, '-iis', '') }}
          pool:
            name: OnPrem-IIS
          strategy:
            runOnce:
              deploy:
                steps:
                  - download: none
                  - checkout: self
                    fetchDepth: 1
                  - task: PowerShell@2
                    displayName: Switch site to ${{ parameters.toBuild }} and smoke test
                    inputs:
                      targetType: inline
                      # Inline call, not 'arguments': the org's shell-argument validation rejects characters
                      # such as '@' in the pinned image digests (https://aka.ms/ado/75787).
                      script: |
                        & ".azure/scripts/rollback-iis.ps1" -SiteName '$(apiIisSite)' -AppPoolName '$(apiIisSite)' -ToBuild '${{ parameters.toBuild }}' -HealthCheckUrl 'http://localhost:$(apiIisPort)/health'
                        exit $LASTEXITCODE
                      pwsh: false
                  - template: templates/steps/notify.yml
                    parameters:
                      stage: Rollback ${{ parameters.target }}
                      status: $(Agent.JobStatus)
                      detail: Requested target ${{ parameters.toBuild }}
                      windowsPowerShell: true

      - ${{ if eq(parameters.target, 'prod-containerapps') }}:
        - deployment: RollbackContainerApp
          displayName: Container App (NetCore.API)
          environment: prod
          pool:
            vmImage: ubuntu-24.04
          strategy:
            runOnce:
              deploy:
                steps:
                  - download: none
                  - checkout: self
                    fetchDepth: 1
                  - task: AzureCLI@2
                    displayName: Shift 100% traffic to ${{ parameters.toBuild }}
                    inputs:
                      azureSubscription: $(azureServiceConnection)
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail
                        app="$(apiContainerApp)"; rg="$(resourceGroup)"; want="${{ parameters.toBuild }}"
                        live="$(az containerapp ingress traffic show -n "$app" -g "$rg" --query "sort_by([?weight > \`0\`], &weight)[-1].revisionName" -o tsv)"
                        if [[ "$want" == "previous" ]]; then
                          # Newest revision other than the live one: deploy-containerapps.sh keeps it active at 0%.
                          target="$(az containerapp revision list -n "$app" -g "$rg" --all \
                            --query "sort_by([?name != '$live'], &properties.createdTime)[-1].name" -o tsv)"
                        else
                          # Revision names are <app>--b<build with dashes>-a<attempt>; take the latest attempt.
                          prefix="$app--b$(tr '.' '-' <<<"$want")-"
                          target="$(az containerapp revision list -n "$app" -g "$rg" --all \
                            --query "sort_by([?starts_with(name, '$prefix')], &properties.createdTime)[-1].name" -o tsv)"
                        fi
                        [[ -z "$target" ]] && { echo "##vso[task.logissue type=error]No revision found for '$want'."; exit 1; }
                        echo "Live: $live  ->  rolling back to: $target"
                        if [[ "$(az containerapp revision show -n "$app" -g "$rg" --revision "$target" --query properties.active -o tsv)" != "true" ]]; then
                          az containerapp revision activate -n "$app" -g "$rg" --revision "$target" --only-show-errors
                        fi
                        az containerapp ingress traffic set -n "$app" -g "$rg" --revision-weight "$target=100" --only-show-errors >/dev/null
                        fqdn="$(az containerapp revision show -n "$app" -g "$rg" --revision "$target" --query properties.fqdn -o tsv)"
                        for i in $(seq 1 12); do
                          curl -fsS --max-time 10 "https://$fqdn/health" >/dev/null && { echo "Healthy: $target"; exit 0; }
                          sleep 10
                        done
                        echo "##vso[task.logissue type=error]$target is live but not healthy."; exit 1
                  - template: templates/steps/notify.yml
                    parameters:
                      stage: Rollback prod (Container App)
                      status: $(Agent.JobStatus)
                      detail: Requested target ${{ parameters.toBuild }}
