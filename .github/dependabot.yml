version: 2
updates:
  # Maintain NuGet package dependencies for .NET Core Web API 
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "ci-cd"

  # Base images of the Azure DevOps pipeline's Dockerfiles (.azure/docker). Patched base
  # images are what keep the Trivy image gate green over time.
  - package-ecosystem: "docker"
    directory: "/.azure/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
