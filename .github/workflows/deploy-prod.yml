name: Deploy - PROD (Azure Container Apps)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-prod:
    name: Deploy to Production (Azure Container Apps)
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        shell: pwsh
        run: |
          ./scripts/deploy-containerapps.ps1 `
            -AppName "${{ vars.AZURE_ACA_APP_NAME || 'netcore-api' }}" `
            -ImageTag "${{ vars.AZURE_ACR_NAME || 'myacr' }}.azurecr.io/netcore-api:${{ github.sha }}" `
            -ResourceGroup "${{ vars.AZURE_RESOURCE_GROUP || 'rohit-vm_group' }}" `
            -HealthCheckPath "/WeatherForecast"
