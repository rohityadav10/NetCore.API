name: Deploy - SIT (IIS)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI - Build, Test, Scan"]
    types: [completed]
    branches: ["release"]

permissions:
  contents: read
  actions: read

jobs:
  deploy-sit:
    name: Deploy to SIT (IIS)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, windows]
    environment:
      name: sit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        id: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build and Publish API (fallback if artifact absent)
        if: steps.download-artifact.outcome != 'success' || !hashFiles('./publish/**')
        run: |
          dotnet publish NetCore.API.csproj --configuration Release --output ./publish

      - name: Deploy API to IIS
        shell: powershell
        run: |
          ./scripts/deploy-iis.ps1 `
            -ArtifactPath "./publish" `
            -SitePath "${{ vars.IIS_SITE_PATH || 'C:\inetpub\wwwroot\api' }}" `
            -AppPoolName "${{ vars.IIS_APP_POOL || 'NetCoreApiAppPool' }}" `
            -SiteName "${{ vars.IIS_SITE_NAME || 'NetCoreAPI' }}" `
            -HealthCheckUrl "${{ vars.HEALTH_CHECK_URL || 'http://localhost:8080/WeatherForecast' }}" `
            -EnvironmentName "SIT"
