name: Rollback - SIT (IIS)

on:
  workflow_dispatch:
    inputs:
      backup_dir:
        description: 'Backup folder to restore (leave "latest" for most recent backup)'
        required: false
        default: 'latest'

jobs:
  rollback:
    name: Rollback IIS Deployment
    runs-on: [self-hosted, windows]
    environment:
      name: sit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute IIS Rollback
        shell: powershell
        # The input goes through an environment variable, never straight into the script
        # text: `${{ }}` interpolation into `run:` allows command injection (Semgrep
        # run-shell-injection).
        env:
          BACKUP_DIR: ${{ github.event.inputs.backup_dir }}
        run: |
          ./scripts/rollback-iis.ps1 `
            -BackupDir "$env:BACKUP_DIR" `
            -SitePath "C:\inetpub\wwwroot\api" `
            -AppPoolName "NetCoreApiAppPool" `
            -SiteName "NetCoreAPI"
