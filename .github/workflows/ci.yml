name: CI - Build, Test, Scan

on:
  push:
    branches: [ "release", "uat", "sit" ]
  pull_request:
    branches: [ "release", "uat", "sit" ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: NetCore.API.sln
  API_PROJECT: NetCore.API.csproj
  TEST_PROJECT: tests/NetCore.API.Tests/NetCore.API.Tests.csproj
  COVERAGE_THRESHOLD: 50

jobs:

  # Stage 1: Restore, Build, Test, Coverage
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Test Results
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: 'false'

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults/**/*.trx

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: CoverageReport
          reporttypes: HtmlInline_AzurePipelines;Cobertura;TextSummary

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage-report
          path: CoverageReport

      - name: Enforce coverage threshold
        run: |
          COVERAGE_FILE=$(find CoverageReport -name "Summary.txt" | head -1)
          if [ -f "$COVERAGE_FILE" ]; then
            LINE_COVERAGE=$(grep "Line coverage" "$COVERAGE_FILE" | grep -oP '[\d.]+' | head -1)
            echo "Line coverage: ${LINE_COVERAGE}%"
            if (( $(echo "$LINE_COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "::error::Coverage ${LINE_COVERAGE}% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
              exit 1
            fi
            echo "Coverage ${LINE_COVERAGE}% meets threshold ${{ env.COVERAGE_THRESHOLD }}%"
          else
            echo "::warning::Coverage summary not found, skipping threshold check"
          fi

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Build succeeded
        run: echo "Build, test, and publish completed successfully"

  # Stage 2: Security Scanning (SAST + Dependencies)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: SAST - Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/csharp
            p/dotnet
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_RULES: p/csharp p/dotnet p/owasp-top-ten p/secrets

      - name: Dependency scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          output: 'trivy-dependency-results.txt'

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-dependency-scan
          path: trivy-dependency-results.txt

      - name: Security scan passed
        run: echo "SAST and dependency scans passed, no High/Critical findings"

  # Stage 3: Containerize
  containerize:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t netcore-api:${{ github.sha }} \
            -t netcore-api:latest \
            -f Dockerfile .

      - name: Scan Docker image - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'netcore-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          output: 'trivy-image-results.txt'

      - name: Upload image scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-scan
          path: trivy-image-results.txt

      - name: Container build succeeded
        run: echo "Docker image built and scanned - netcore-api:${{ github.sha }}"

  # Stage 4: Verify Azure Keyless Authentication via OIDC
  azure-oidc-verify:
    name: Verify Azure OIDC Login
    runs-on: ubuntu-latest
    needs: containerize
    if: github.ref == 'refs/heads/release'
    steps:
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Connection
        run: |
          az account show
